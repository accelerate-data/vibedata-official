# dbt Docs publishing (docs/design/domain-ci-release, Callers; domain-deploy). Called by the domain repo's
# publish.yml after publish-manifest.yml. Generates the static dbt Docs site from the production parse (no
# connection: --empty-catalog --no-compile) and uploads it to `dbt-docs-latest`. Platform-agnostic (D21).
name: Publish dbt Docs

on:
  workflow_call: {}

permissions:
  contents: write   # uploads to the domain repo's dbt-docs-latest release

env:
  PYTHON_VERSION: "3.11"

jobs:
  publish-docs:
    name: publish-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: vibedata-domain-ci publish-docs
