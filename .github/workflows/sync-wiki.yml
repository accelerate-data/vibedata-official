# Copy this file to accelerate-data/vibedata-official as
#   .github/workflows/sync-wiki.yml
#
# It mirrors accelerate-data/migration-utility/.github/workflows/sync-wiki.yml.
# Source of truth is docs/wiki/ in this repository; the wiki is a render of it.
# Do not hand-edit pages in the wiki UI — the next sync overwrites them.
name: Sync Wiki

on:
  push:
    branches: [main]
    paths: [docs/wiki/**]
  workflow_dispatch: {}

# The wiki has no branch protection and no PR gate. Two overlapping runs would
# both clone, then the second push would be rejected as non-fast-forward.
# Queue them instead of cancelling, so no docs commit is silently dropped.
concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Push to wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo
          cp docs/wiki/*.md wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No wiki changes to publish"
          else
            git commit -m "Sync wiki from docs/wiki/ (${GITHUB_SHA::7})"
            git push
          fi
