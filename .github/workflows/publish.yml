# Public release publish pipeline for VibeData Studio.
#
# Triggered by a `studio-release` repository_dispatch from
# accelerate-data/vd-studio's deploy.yml AFTER that workflow has already:
#   - verified the candidate's cosign signature + SBOM + SLSA attestations,
#   - promoted BOTH images via `crane copy` (sigstore referrers preserved, no
#     re-sign) into the public ghcr.io/accelerate-data/studio-{backend,frontend}
#     packages under the same vX.Y.Z tag.
#
# So this workflow must NOT re-promote the images — a docker pull/tag/push would
# drop the cosign/SBOM/SLSA referrers and ship unsigned public images. It only:
#   1. Sanity-verifies the promoted PUBLIC images are signed (referrers survived).
#   2. Downloads the studio-built release artifacts (CLI binaries and install
#      script) from the source workflow run.
#   3. Creates the GitHub Release vX.Y.Z with those artifacts.
#   4. Publishes the operator documentation to the vibedata-official GitHub wiki
#      via the reusable operator-wiki workflow (.github/workflows/wiki.yml), with
#      the released version, studio commit, and release notes from the same
#      dispatch payload rendered into the wiki's generated Release.md. The payload
#      gate refuses to publish when the payload does not name the build
#      (VD-5737).
#
# Canonical contract: vd-studio docs/design/devops/03-release-promotion.md.

name: publish

on:
  repository_dispatch:
    types: [studio-release]

permissions:
  contents: write # create the GitHub Release and upload operator assets
  packages: read # crane digest on the public studio-* packages

concurrency:
  group: publish-${{ github.event.client_payload.candidate_tag }}
  cancel-in-progress: false

env:
  STUDIO_REPO: accelerate-data/studio
  GHCR: ghcr.io
  OWNER: accelerate-data
  PUBLIC_BACKEND: studio-backend
  PUBLIC_FRONTEND: studio-frontend
  COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_IDENTITY_REGEXP: ^https://github\.com/accelerate-data/studio/\.github/workflows/create-candidate-image\.yml@refs/heads/main$

jobs:
  publish:
    name: Publish Studio release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.payload.outputs.tag }}
      sha: ${{ steps.payload.outputs.sha }}
      notes: ${{ steps.payload.outputs.notes }}
    steps:
      - name: Validate dispatch payload
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "$PAYLOAD" > /tmp/payload.json
          TAG=$(jq -r '.candidate_tag // empty' /tmp/payload.json)
          SHA=$(jq -r '.candidate_sha // empty' /tmp/payload.json)
          RUN_ID=$(jq -r '.source_workflow_run_id // empty' /tmp/payload.json)
          NOTES=$(jq -r '.release_notes_body // ""' /tmp/payload.json)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::candidate_tag must be vMAJOR.MINOR.PATCH (got '$TAG')"; exit 1
          fi
          if [ -z "$SHA" ]; then
            echo "::error::missing candidate_sha — the published docs must name the studio commit they describe"; exit 1
          fi
          if [ -z "$NOTES" ]; then
            echo "::error::missing release_notes_body — the published docs must carry the release notes"; exit 1
          fi
          if [ -z "$RUN_ID" ]; then echo "::error::missing source_workflow_run_id"; exit 1; fi
          jq -r '.release_notes_body // ""' /tmp/payload.json > /tmp/release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          # Multi-line output via a delimiter; the docs job consumes the same
          # validated identity rather than re-parsing and re-validating it.
          DELIM="NOTES_EOF_$(openssl rand -hex 8)"
          {
            echo "notes<<${DELIM}"
            printf '%s\n' "$NOTES"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
          echo "Validated payload for $TAG (source run $RUN_ID, studio $SHA)"

      - uses: actions/checkout@v7

      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Pin cosign; v2.5.2 supports --offline. The nightly self-verify hung
          # 40+ min on an online Rekor lookup during a sigstore slow window
          # (vd-studio cc217782) — verifying --offline here avoids that.
          cosign-release: v2.5.2

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Trust sanity: the promoted PUBLIC images must carry a valid signature
      # from Studio's main-branch candidate-build identity — proves crane copy carried the
      # referrers across. --offline verifies the bundle SET without an online
      # Rekor call (no hang).
      - name: Verify public images are signed
        env:
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          for repo in "$PUBLIC_BACKEND" "$PUBLIC_FRONTEND"; do
            echo "Verifying ${GHCR}/${OWNER}/${repo}:${TAG}"
            cosign verify --offline \
              --certificate-identity-regexp "$COSIGN_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
              "${GHCR}/${OWNER}/${repo}:${TAG}"
          done

      - name: Mint cross-repo token (vd-studio)
        # App token (vibedata-gha-app) — GITHUB_TOKEN can't read another repo's
        # run artifacts; this scopes a short-lived token to vd-studio (Actions: read).
        uses: actions/create-github-app-token@v3
        id: studio-token
        with:
          app-id: ${{ secrets.VIBEDATA_GHA_APP_ID }}
          private-key: ${{ secrets.VIBEDATA_GHA_APP_PRIVATE_KEY }}
          owner: accelerate-data
          repositories: studio
      - name: Download studio release artifacts
        env:
          GH_TOKEN: ${{ steps.studio-token.outputs.token }}
          RUN_ID: ${{ steps.payload.outputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$STUDIO_REPO" --dir artifacts
          # gh nests each artifact in its own directory — flatten into dist/.
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          echo "--- downloaded artifacts ---"; ls -la dist

      - name: Verify the release artifact set is complete
        run: |
          required=(
            "vibedata-linux-x86_64"
            "vibedata-linux-arm64"
            "vibedata-darwin-arm64"
            "vibedata-windows-x86_64.exe"
            "install.sh"
          )
          missing=()
          for f in "${required[@]}"; do
            [ -f "dist/${f}" ] || missing+=("${f}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::release is incomplete — missing artifacts: ${missing[*]}"
            exit 1
          fi
          echo "all required release artifacts present"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          ASSETS=(dist/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes-file /tmp/release-notes.md
          fi
          echo "Published GitHub Release $TAG"

  docs:
    name: Publish operator documentation
    # Runs only after the GitHub Release exists. It consumes the identity the
    # `publish` job validated from the dispatch payload — the single gate — so a
    # release cannot publish documentation that does not name its own build.
    # The implementation is the reusable operator-wiki workflow, which is also
    # dispatchable by hand for the initial bring-up and docs-only republishes.
    needs: publish
    permissions:
      contents: read # checkout the documentation sources
    uses: ./.github/workflows/wiki.yml
    with:
      candidate_tag: ${{ needs.publish.outputs.tag }}
      candidate_sha: ${{ needs.publish.outputs.sha }}
      release_notes_body: ${{ needs.publish.outputs.notes }}
    secrets: inherit
