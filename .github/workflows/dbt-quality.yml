# dbt Quality (docs/design/domain-ci-release D9, D11): dbt-project-evaluator against a temporary copy of the
# Domain's packages.yml that adds the release's pinned evaluator. Advisory: it always passes, its findings are
# warnings. Released on its own (AC-1). domain-ci.yml runs the identical steps inline as its `dbt-quality` job
# (one `ci / dbt-quality`, AC-19); an invariant keeps the two in step. It writes `result-dbt-quality`.
# Kept (VD-7648): release.py's RELEASED_WORKFLOWS publishes it to vibedata-official, where domain repos call it.
# It never runs in this repo (workflow_call only), so its manual disable in this repo's Actions UI changes nothing.
name: dbt Quality

on:
  workflow_call: {}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  dbt-quality:
    name: dbt-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: vibedata-domain-ci check dbt-quality
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-dbt-quality
          overwrite: true
          path: results/result-dbt-quality.json
          if-no-files-found: ignore
