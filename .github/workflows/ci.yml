name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch main branch
        run: git fetch origin main --depth=1

      - name: Validate JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          find plugins -path '*/.codex-plugin/plugin.json' -print -exec python3 -m json.tool {} >/dev/null \;

      - name: Validate marketplace
        run: python3 scripts/validate-marketplace.py --base-ref origin/main

      - name: Check plugin version bump
        run: python3 scripts/check-plugin-version-bump.py --base-ref origin/main

      - name: Install dev tools
        run: python3 -m pip install --upgrade -r requirements-dev.txt

      - name: Check the catalog is generated and current
        run: python3 scripts/build_catalog.py --check

      - name: Mint read-only token for the private design-system repository
        id: theme-contract-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.VIBEDATA_GHA_APP_ID }}
          private-key: ${{ secrets.VIBEDATA_GHA_APP_PRIVATE_KEY }}
          owner: accelerate-data
          repositories: vd-design-system
          permission-contents: read

      - name: Checkout the theme contract validator
        uses: actions/checkout@v7
        with:
          repository: accelerate-data/vd-design-system
          # Publish-time test reference, not Studio's runtime design-system pin.
          ref: 7b10f64df104ba7b13dcf8bf724c8d62cf1f57a9
          path: .theme-contract
          token: ${{ steps.theme-contract-token.outputs.token }}
          persist-credentials: false

      - name: Validate every theme against the design-system contract
        run: python3 .theme-contract/scripts/check_theme.py themes/*.json

      - name: Lint Python
        run: python3 -m ruff check scripts tests

      - name: Check Python formatting
        run: python3 -m ruff format --check scripts tests

      - name: Compile Python
        run: python3 -m py_compile scripts/validate-marketplace.py scripts/check-plugin-version-bump.py scripts/build_catalog.py

      - name: Run tests with coverage
        run: |
          python3 -m coverage run -m unittest discover -s tests
          python3 -m coverage report --fail-under=70

      - name: Check whitespace
        run: git diff --check
