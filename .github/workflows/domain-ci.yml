  # The only producer of a CI environment (docs/design/domain-pr-ci-engine § Provision outputs), created
  # once per PR before the first check that needs it and reused by every push (on MotherDuck, re-cloned from
  # production on every run, VD-7717). Nothing in this workflow
  # deletes it: PR close or the nightly sweep does (AC-34). A fork PR gets no secrets, so the job is
  # skipped and the planner fails the checks that need it (AC-72); a deleted fork counts as a fork.
  provision:
    name: provision
    needs: [preflight, plan]
    if: >-
      ${{ always() && needs.preflight.result == 'success'
      && needs.plan.outputs.needs_environment == 'true'
      && github.event.pull_request.head.repo.fork == false }}
    # One provision at a time per PR, so a later push never races an earlier one's create (or MotherDuck re-clone).
    # Never cancel: a cancelled in-flight create is not rolled back. When a new push cancels the run (the caller's
    # concurrency, AC-109), GitHub re-evaluates each running job's `if:` and cancels only those now false: `always()`
    # lets provision complete (even one still waiting in its group), while every other job's `!cancelled()` stops it
    # starting (AC-33).
    concurrency:
      group: domain-ci-provision-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      workspace_id: ${{ steps.provision.outputs.workspace_id }}
      workspace_name: ${{ steps.provision.outputs.workspace_name }}
      lakehouse_id: ${{ steps.provision.outputs.lakehouse_id }}
      lakehouse_name: ${{ steps.provision.outputs.lakehouse_name }}
      onelake_bucket_url: ${{ steps.provision.outputs.onelake_bucket_url }}
      database: ${{ steps.provision.outputs.database }}
      warehouse_id: ${{ steps.provision.outputs.warehouse_id }}
      bridge_lakehouse_id: ${{ steps.provision.outputs.bridge_lakehouse_id }}
      host: ${{ steps.provision.outputs.host }}
      schema_prefix: ${{ steps.provision.outputs.schema_prefix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - id: inputs
        run: vibedata-domain-ci provision-inputs
      - name: Sign in to Azure
        if: ${{ startsWith(needs.preflight.outputs.platform, 'fabric_') }}
        uses: azure/login@v3
        with:
          tenant-id: ${{ vars[steps.inputs.outputs.azure_tenant_id_var] }}
          client-id: ${{ vars[steps.inputs.outputs.azure_client_id_var] }}
          allow-no-subscriptions: true
      - name: Install the Databricks CLI
        if: ${{ needs.preflight.outputs.platform == 'databricks' }}
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
        with:
          version: 1.22.1
      - name: Provision the CI environment
        id: provision
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DATABRICKS_CLIENT_ID: ${{ vars[steps.inputs.outputs.databricks_client_id_var] }}
          DATABRICKS_AUTH_TYPE: ${{ needs.preflight.outputs.platform == 'databricks' && 'github-oidc' || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FABRIC_CAPACITY_ID: ${{ vars[steps.inputs.outputs.fabric_capacity_id_var] }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: vibedata-domain-ci provision
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-provision
          overwrite: true
          path: results/result-provision.json
          if-no-files-found: ignore

  dlt-gate:
    name: dlt-gate
    needs: [preflight, plan, provision]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.plan.outputs.run_dlt_gate == 'true' && needs.provision.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      # dlt's Warehouse destination opens TDS through pyodbc with "ODBC Driver 18 for SQL Server", which the runner
      # image does not ship (VD-7579).
      - name: SQL Server ODBC driver
        if: ${{ needs.plan.outputs.platform == 'fabric_warehouse' }}
        run: |
          curl -fsSL -o /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18
      - name: Sign in (Fabric)
        if: ${{ startsWith(needs.plan.outputs.platform, 'fabric_') }}
        uses: azure/login@v3
        with:
          tenant-id: ${{ vars[needs.plan.outputs.azure_tenant_id_var] }}
          client-id: ${{ vars[needs.plan.outputs.azure_client_id_var] }}
          allow-no-subscriptions: true
      # dlt's Warehouse destination reads a TDS token, not the Azure CLI session (ingestion design § Destination
      # retargeting).
      - name: Warehouse SQL token
        if: ${{ needs.plan.outputs.platform == 'fabric_warehouse' }}
        run: |
          token=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "DESTINATION__FABRIC__CREDENTIALS__ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
      # Databricks: the plugin's run_notebook.py drives the CLI, signed in as the service principal through GitHub OIDC.
      - name: Install the Databricks CLI
        if: ${{ needs.plan.outputs.platform == 'databricks' }}
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
        with:
          version: 1.22.1
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_ENTRY: ${{ toJSON(fromJSON(needs.plan.outputs.to_run)['dlt-gate']) }}
          PROVISION_OUTPUTS: ${{ toJSON(needs.provision.outputs) }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          DATABRICKS_CLIENT_ID: ${{ vars[needs.plan.outputs.databricks_client_id_var] }}
          DATABRICKS_AUTH_TYPE: ${{ needs.plan.outputs.platform == 'databricks' && 'github-oidc' || '' }}
        run: vibedata-domain-ci check dlt-gate
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-dlt-gate
          overwrite: true
          path: results/result-dlt-gate.json
          if-no-files-found: ignore

  dbt-gate:
    name: dbt-gate
    needs: [preflight, plan, provision, dlt-gate]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.plan.outputs.run_dbt_gate == 'true' && needs.provision.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.dlt-gate.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      # The Warehouse TDS connection's system driver, as in dlt-gate; dbt-fabric's mssql-python is not expected to
      # need it, but the gate must not depend on that (VD-7579).
      - name: SQL Server ODBC driver
        if: ${{ needs.plan.outputs.platform == 'fabric_warehouse' }}
        run: |
          curl -fsSL -o /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18
      - name: Fetch dlt-gate's result (the sources it did not ingest)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: result-dlt-gate
          path: results
      - name: Sign in (Fabric)
        if: ${{ startsWith(needs.plan.outputs.platform, 'fabric_') }}
        uses: azure/login@v3
        with:
          tenant-id: ${{ vars[needs.plan.outputs.azure_tenant_id_var] }}
          client-id: ${{ vars[needs.plan.outputs.azure_client_id_var] }}
          allow-no-subscriptions: true
      # Production state, written outside the checkout; a failed fetch leaves it empty and the check says so.
      - name: Fetch production state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: vibedata-domain-ci prod-state
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_ENTRY: ${{ toJSON(fromJSON(needs.plan.outputs.to_run)['dbt-gate']) }}
          PROVISION_OUTPUTS: ${{ toJSON(needs.provision.outputs) }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          DATABRICKS_CLIENT_ID: ${{ vars[needs.plan.outputs.databricks_client_id_var] }}
        run: vibedata-domain-ci check dbt-gate
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-dbt-gate
          overwrite: true
          path: results/result-dbt-gate.json
          if-no-files-found: ignore

  # Until VD-7115 it skips every pipeline it selects: the smoke run cannot apply the row cap yet.
  pipeline-smoke-run:
    name: pipeline-smoke-run
    needs: [preflight, plan, provision, dlt-gate, dbt-gate]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.plan.outputs.run_pipeline_smoke_run == 'true' && needs.provision.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.dlt-gate.result) && contains(fromJSON('["success","skipped"]'), needs.dbt-gate.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - id: check
        env:
          CHECK_ENTRY: ${{ toJSON(fromJSON(needs.plan.outputs.to_run)['pipeline-smoke-run']) }}
          PROVISION_OUTPUTS: ${{ toJSON(needs.provision.outputs) }}
        run: vibedata-domain-ci check pipeline-smoke-run
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-pipeline-smoke-run
          overwrite: true
          path: results/result-pipeline-smoke-run.json
          if-no-files-found: ignore

  # Static only: no environment, no deploy, no schedule (orchestration AC-16, AC-17).
  orchestration-static:
    name: orchestration-static
    needs: [preflight, plan]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.plan.outputs.run_orchestration_static == 'true' }}
    runs-on: ubuntu-latest
    # id-token: Databricks `bundle validate` signs in as the Domain's CI service principal through GitHub OIDC, which
    # only reads the workspace (AC-151). The job gets no secret and never deploys, runs or activates a bundle
    # (orchestration-validation AC-16, AC-17).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      # Pinned by commit SHA: this third-party action runs in a job that can mint an OIDC token. A fork or Dependabot
      # PR gets no OIDC token, so the CLI is not installed and `bundle validate` does not run there.
      - name: Install the Databricks CLI
        if: ${{ needs.plan.outputs.platform == 'databricks' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' }}
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
        with:
          version: 1.22.1
      - id: check
        env:
          CHECK_ENTRY: ${{ toJSON(fromJSON(needs.plan.outputs.to_run)['orchestration-static']) }}
          # The workspace host comes from ci-config.yml (the shell sets it).
          DATABRICKS_CLIENT_ID: ${{ vars[needs.plan.outputs.databricks_client_id_var] }}
          DATABRICKS_AUTH_TYPE: ${{ needs.plan.outputs.platform == 'databricks' && 'github-oidc' || '' }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork != false }}  # a deleted fork (null repo) is a fork
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: vibedata-domain-ci check orchestration-static
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-orchestration-static
          overwrite: true
          path: results/result-orchestration-static.json
          if-no-files-found: ignore

  version-bump:
    name: version-bump
    if: ${{ !cancelled() && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      is_version_bump: ${{ steps.check.outputs.is_version_bump }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      # On a version-bump PR: fails when it changes more than the pins or the pins differ; else renames the PR.
      # Until the engine is released, install-engine installs the 0.0.0 development build and the pin check is skipped.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: vibedata-domain-ci check version-bump
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-version-bump
          overwrite: true
          path: results/result-version-bump.json
          if-no-files-found: ignore

  verdict:
    name: verdict
    needs: [preflight, static, sql-lint, adr-numbering, logical-model, design-drift, dbt-parse, dlt-static, dbt-breaking-changes, data-files, dbt-quality, dependency-audit, ci-files-changed, version-bump, plan, provision, dlt-gate, dbt-gate, pipeline-smoke-run, orchestration-static]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Only root requirements.txt: the engine install reads it (AC-65).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Only the engine (and pyyaml), so a root file that does not install still gets its verdict (AC-65, AC-159).
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          ci=$(grep -Ei '^[[:space:]]*vibedata[-_.]domain[-_.]ci([^A-Za-z0-9_.-]|$)' requirements.txt 2>/dev/null | head -n 1 | sed 's/[[:space:]]*#.*//; s/[[:space:]]*$//' || true)
          if [ -z "$ci" ]; then
            echo "::error title=requirements.txt::root requirements.txt has no vibedata-domain-ci line; ci / verdict installs the engine at the version that line pins."
            exit 1
          fi
          yaml=$(grep -Ei '^[[:space:]]*py[-_.]?yaml([^A-Za-z0-9_.-]|$)' requirements.txt | head -n 1 | sed 's/[[:space:]]*#.*//; s/[[:space:]]*$//' || true)
          uv pip install --system --no-deps "$ci" "${yaml:-pyyaml}"
      # A failed download (or act's artifact server with nothing uploaded) must not stop the comment: a job whose
      # result is missing is reported as not finished (engine AC-159).
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: vibedata-domain-ci verdict --results-dir results
