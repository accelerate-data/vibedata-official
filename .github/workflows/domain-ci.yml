# The Domain CI engine (docs/design/domain-pr-ci-engine, docs/design/domain-ci-release): one job per baseline
# check, each reported as `ci / <check>`, a `plan` job that validates the PR's CI plan, and one `ci / verdict`
# that decides the PR and posts one comment. dbt Quality is also released on its own (dbt-quality.yml); the
# `dbt-quality` job here runs the same steps inline so it reports as one `ci / dbt-quality`.
#
# A domain repo calls the released copy from vibedata-official through the caller template onboarding writes
# (packaged as vibedata_domain_ci/data/callers/ci.yml): a `config` job reads each secret's name from
# .workflow/ci-config.yml, and a job named `ci` (so GitHub shows `ci / <check>`) holds only the pin, inputs and
# secrets. The caller grants the permissions the engine's jobs need: a called workflow cannot raise its
# caller's token. Secrets are passed by name, one line each (they do not pass across organisations implicitly).
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#   permissions: { contents: read, pull-requests: write, id-token: write }
#   jobs:
#     config: …                # outputs the secret names .workflow/ci-config.yml gives
#     ci:
#       needs: config
#       uses: accelerate-data/vibedata-official/.github/workflows/domain-ci.yml@domain-ci/vX.Y.Z
#       with:
#         llm_api_url: ${{ vars[needs.config.outputs.llm_api_url] }}
#         llm_model: ${{ vars[needs.config.outputs.llm_model] }}
#       secrets:
#         LLM_API_KEY: ${{ secrets[needs.config.outputs.llm_api_key] }}
#         MOTHERDUCK_TOKEN: ${{ secrets[needs.config.outputs.motherduck_token] }}
#
# Every job installs the engine and its tools in one step from the Domain's root requirements.txt (AC-65). In source
# that is install-engine@main: the file less its two vibedata-domain-* lines, then the engine from main, never from
# the PR's own tree (AC-20). The release stamps each install-engine step into `uv pip install -r requirements.txt` (D2);
# every job checks the Domain out first, so that file is there. `ci / verdict` installs only the engine (engine-only),
# so a root file that does not install still gets its verdict (AC-65, AC-159).
name: Domain CI engine

on:
  workflow_call:
    inputs:
      llm_api_url:
        description: Design-drift LLM endpoint (OpenAI-compatible); a required Variable, so empty fails ci / preflight.
        type: string
        default: ""
      llm_model:
        description: Design-drift LLM model; a required Variable, so empty fails ci / preflight.
        type: string
        default: ""
    secrets:
      LLM_API_KEY:
        description: Key for the design-drift LLM endpoint.
        required: false
      MOTHERDUCK_TOKEN:
        description: MotherDuck token for the checks that need the CI environment (MotherDuck domains).
        required: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Every job reads the domain repo's layout through the base branch's repo-map.json roles (AC-73, AC-74).
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  preflight:
    name: preflight
    # A Dependabot version-bump PR runs only ci / version-bump (AC-158); on any other PR version-bump is skipped.
    needs: [version-bump]
    if: ${{ !cancelled() && needs.version-bump.outputs.is_version_bump != 'true' }}
    runs-on: ubuntu-latest
    # id-token: Databricks preflight signs in through GitHub OIDC to probe the Domain's grants (AC-144, AC-145).
    permissions:
      contents: read
      id-token: write
    outputs:
      platform: ${{ steps.check.outputs.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - id: inputs
        run: vibedata-domain-ci provision-inputs
      # Pinned by commit SHA: this third-party action runs in a job that can mint an OIDC token. Databricks only.
      - name: Install the Databricks CLI
        if: ${{ steps.inputs.outputs.platform == 'databricks' }}
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
        with:
          version: 1.22.1
      # One presence flag per `*_VAR` key the platform's `required_github` declares (domain-ci-release D22,
      # AC-52): GITHUB_TOKEN cannot list a repo's Secrets or Variables, so preflight checks what arrived, never
      # a value. `provision` needs preflight, so a missing one is named before the CI environment is created.
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          VD_GITHUB_PRESENT_LLM_API_KEY_VAR: ${{ secrets.LLM_API_KEY != '' }}
          VD_GITHUB_PRESENT_LLM_API_URL_VAR: ${{ inputs.llm_api_url != '' }}
          VD_GITHUB_PRESENT_LLM_MODEL_VAR: ${{ inputs.llm_model != '' }}
          VD_GITHUB_PRESENT_MOTHERDUCK_TOKEN_VAR: ${{ secrets.MOTHERDUCK_TOKEN != '' }}
          VD_GITHUB_PRESENT_AZURE_TENANT_ID_VAR: ${{ vars[steps.inputs.outputs.azure_tenant_id_var] != '' }}
          VD_GITHUB_PRESENT_AZURE_CLIENT_ID_VAR: ${{ vars[steps.inputs.outputs.azure_client_id_var] != '' }}
          VD_GITHUB_PRESENT_FABRIC_CAPACITY_ID_VAR: ${{ vars[steps.inputs.outputs.fabric_capacity_id_var] != '' }}
          VD_GITHUB_PRESENT_DATABRICKS_CLIENT_ID_VAR: ${{ vars[steps.inputs.outputs.databricks_client_id_var] != '' }}
          # Databricks sign-in (AC-144): the service principal's client ID from the Variable ci-config.yml names, and
          # GitHub OIDC instead of a stored secret. The workspace host comes from ci-config.yml (the shell sets it).
          DATABRICKS_CLIENT_ID: ${{ vars[steps.inputs.outputs.databricks_client_id_var] }}
          DATABRICKS_AUTH_TYPE: ${{ steps.inputs.outputs.platform == 'databricks' && 'github-oidc' || '' }}
          # A Vertex AI URL waives LLM_API_KEY; a fork PR gets no Secrets, so an absent value only warns.
          VD_GITHUB_LLM_API_URL: ${{ inputs.llm_api_url }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          # A Dependabot run gets only Dependabot Secrets, so an absent value only warns too.
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: vibedata-domain-ci check preflight
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-preflight
          overwrite: true
          path: results/result-preflight.json
          if-no-files-found: ignore

  static:
    name: static
    needs: [preflight, version-bump]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.version-bump.outputs.is_version_bump != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - name: Install gitleaks
        run: |
          case "$(uname -m)" in
            arm64|aarch64) GITLEAKS_ARCH=linux_arm64 ;;
            *)              GITLEAKS_ARCH=linux_x64 ;;
          esac
          # Download to a file first: a retried download piped straight into tar would hand tar a broken stream (AC-156).
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 15 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_${GITLEAKS_ARCH}.tar.gz"
          tar xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: vibedata-domain-ci check static
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-static
          overwrite: true
          path: results/result-static.json
          if-no-files-found: ignore

  adr-numbering:
    name: adr-numbering
    needs: [preflight, version-bump]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.version-bump.outputs.is_version_bump != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: vibedata-domain-ci check adr-numbering
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-adr-numbering
          overwrite: true
          path: results/result-adr-numbering.json
          if-no-files-found: ignore

  logical-model:
    name: logical-model
    needs: [preflight, version-bump]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.version-bump.outputs.is_version_bump != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0  # odcs diff needs the merge-base with the PR's base
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: vibedata-domain-ci check logical-model
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-logical-model
          overwrite: true
          path: results/result-logical-model.json
          if-no-files-found: ignore

  design-drift:
    name: design-drift
    # Reads a declared GitHub Secret or Variable: preflight names a missing one first (domain-ci-release AC-52).
    needs: [preflight, version-bump]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.version-bump.outputs.is_version_bump != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ inputs.llm_api_url }}
          LLM_MODEL: ${{ inputs.llm_model }}
        run: vibedata-domain-ci check design-drift
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-design-drift
          overwrite: true
          path: results/result-design-drift.json
          if-no-files-found: ignore

  dbt-parse:
    name: dbt-parse
    needs: [preflight, version-bump]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.version-bump.outputs.is_version_bump != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: vibedata-domain-ci check dbt-parse
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-dbt-parse
          overwrite: true
          path: results/result-dbt-parse.json
          if-no-files-found: ignore

  # On Fabric the studio unit reaches the Domain's Key Vault as the CI identity when a pipeline is imported
  # (VD-7606), so dlt-static signs in first. A fork PR gets no OIDC token, so its pipeline import fails there.
  dlt-static:
    name: dlt-static
    # Reads a declared GitHub Secret or Variable: preflight names a missing one first (domain-ci-release AC-52).
    needs: [preflight, version-bump]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.version-bump.outputs.is_version_bump != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - id: inputs
        run: vibedata-domain-ci provision-inputs
      - name: Sign in (Fabric)
        if: ${{ startsWith(steps.inputs.outputs.platform, 'fabric_') && github.event.pull_request.head.repo.fork == false }}
        uses: azure/login@v3
        with:
          tenant-id: ${{ vars[steps.inputs.outputs.azure_tenant_id_var] }}
          client-id: ${{ vars[steps.inputs.outputs.azure_client_id_var] }}
          allow-no-subscriptions: true
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: vibedata-domain-ci check dlt-static
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-dlt-static
          overwrite: true
          path: results/result-dlt-static.json
          if-no-files-found: ignore

  dbt-breaking-changes:
    name: dbt-breaking-changes
    needs: [preflight, version-bump]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.version-bump.outputs.is_version_bump != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      # Production state, written outside the checkout; a failed fetch leaves it empty and the check says so.
      - name: Fetch production state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: vibedata-domain-ci prod-state
      - id: check
        run: vibedata-domain-ci check dbt-breaking-changes
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-dbt-breaking-changes
          overwrite: true
          path: results/result-dbt-breaking-changes.json
          if-no-files-found: ignore

  data-files:
    name: data-files
    needs: [preflight, version-bump]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.version-bump.outputs.is_version_bump != 'true' }}
    runs-on: ubuntu-latest
    steps:
