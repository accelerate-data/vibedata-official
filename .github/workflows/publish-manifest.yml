# Production manifest publishing (docs/design/domain-ci-release, Callers; domain-deploy). Called by the domain
# repo's publish.yml on a push to main. Parses the dbt project for production and publishes the immutable
# `dbt-manifest-<sha>` release, then the manifests on `dbt-docs-latest` that PR CI reads as production state.
# Platform-agnostic (D21): `vibedata-domain-ci` selects the platform from .workflow/ci-config.yml. The parse is
# offline, so the workflow signs in to nobody. It deploys no orchestration item (AC-3) and checks out only the
# caller's repo.
name: Publish production manifest

on:
  workflow_call: {}

permissions:
  contents: write   # creates and uploads GitHub Releases in the domain repo

env:
  PYTHON_VERSION: "3.11"

jobs:
  publish-manifest:
    name: publish-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: vd-python
        run: python -c 'import sys; print("version=%d.%d" % sys.version_info[:2])' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          cache-dependency-glob: requirements.txt
          cache-suffix: python-${{ steps.vd-python.outputs.version }}
      - run: |
          missing=""
          for pkg in vibedata-domain-ci vibedata-domain-hooks; do
            pattern="^[[:space:]]*$(echo "$pkg" | sed 's/-/[-_.]/g')([^A-Za-z0-9_.-]|$)"
            grep -Eiq "$pattern" requirements.txt 2>/dev/null || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error title=requirements.txt::root requirements.txt is missing:$missing. Add each line, pinned with ==."
            exit 1
          fi
          if ! uv pip install --system -r requirements.txt; then
            echo "::error title=requirements.txt::\`requirements.txt\` could not be installed; the installer's error is above."
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
          # `github.event.after` reads the push event; workflow_dispatch has none.
          BUILD_SHA: ${{ github.event.after || github.sha }}
        run: vibedata-domain-ci publish-manifest
