# Studio first-party image verification for customer Kubernetes clusters.
#
# Verified against accelerate-data/studio@5c9d2bbf339a9518bd8e7a964c24050ba7c601ef
# on 2026-08-22.
#
# Current release chain:
# - backend/frontend candidate images are signed keyless by
#   .github/workflows/create-candidate-image.yml;
# - deploy.yml promotes the verified candidate to the public package without
#   re-signing it, so the public image keeps the candidate signing identity;
# - vd-agent-server is signed by .github/workflows/agent-server-image.yml.
#
# This policy therefore pins those two GitHub Actions certificate identities.
# Third-party images do not match imageReferences and are outside this policy.
#
# Requires Kyverno >= 1.13 for per-rule failureAction. Cluster nodes must be
# able to reach the Sigstore trust services used for keyless verification, or
# an operator must provide an equivalent mirrored trust root for an air-gapped
# environment.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-studio-images
  annotations:
    policies.kyverno.io/title: Verify Studio image signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/description: >-
      Admit only Accelerate Data Studio first-party images signed by the
      current Studio release and agent-server GitHub Actions workflows.
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  background: false
  rules:
    - name: verify-backend-frontend
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/accelerate-data/studio-backend*"
            - "ghcr.io/accelerate-data/studio-frontend*"
          failureAction: Enforce
          mutateDigest: true
          attestors:
            - entries:
                - keyless:
                    subjectRegExp: "^https://github\\.com/accelerate-data/studio/\\.github/workflows/create-candidate-image\\.yml@.*$"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev

    - name: verify-agent-server
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/accelerate-data/vd-agent-server*"
          failureAction: Enforce
          mutateDigest: true
          attestors:
            - entries:
                - keyless:
                    subjectRegExp: "^https://github\\.com/accelerate-data/studio/\\.github/workflows/agent-server-image\\.yml@.*$"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
